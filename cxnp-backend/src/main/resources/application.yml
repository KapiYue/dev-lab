spring:
  application:
    name: cxnp-backend
  profiles:
    default: dev
  data:
    redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.qingmou.cxnp
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

